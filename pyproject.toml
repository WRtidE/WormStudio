[project]
name = "wormstudio"
version = "1.1.15"
description = "Local worm tracking, posture measurement and video review"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "opencv-python==5.0.0.93",
    "scikit-image==0.26.0",
    "matplotlib==3.11.2",
    "imageio-ffmpeg==0.6.0",
    "PyYAML==6.0.3",
    "Pillow==12.3.0",
    "tqdm==4.70.1",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "iopath==0.1.10",
    "openpyxl==3.1.5",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "sam-2==1.0",
    # SAM2 is built against the selected runtime, without a second Torch install.
    "setuptools>=61",
]

[project.optional-dependencies]
cpu = ["torch==2.7.0", "torchvision==0.22.0"]
cuda = [
    "torch==2.7.0+cu128; sys_platform != 'darwin'",
    "torchvision==0.22.0+cu128; sys_platform != 'darwin'",
]
cuda126 = [
    "torch==2.7.0+cu126; sys_platform != 'darwin'",
    "torchvision==0.22.0+cu126; sys_platform != 'darwin'",
]

[dependency-groups]
release = ["pip>=25", "wheel>=0.45"]

[tool.uv]
required-version = ">=0.11.2"
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "cuda126" }]]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
no-build-isolation-package = ["sam-2"]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda126", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda126", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "0" }

# Static metadata from setup.py at the pinned SAM2 commit. This lets a clean
# checkout resolve dependencies before Torch is installed for the build.
[[tool.uv.dependency-metadata]]
name = "sam-2"
version = "1.0"
requires-dist = [
    "torch>=2.5.1", "torchvision>=0.20.1", "numpy>=1.24.4", "tqdm>=4.66.1",
    "hydra-core>=1.3.2", "iopath>=0.1.10", "pillow>=9.4.0",
]
