name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_source.py
      - name: Verify source export and its file checksums
        if: runner.os == 'Linux'
        run: python tools/export_source.py --output "$RUNNER_TEMP/WormStudio-source"
      - name: Windows x64 desktop startup from a Unicode path
        if: runner.os == 'Windows'
        run: python tests/windows_desktop_smoke.py
      - run: python run_tests.py
      - run: node --test tests/*.js tests/*.cjs
        shell: bash
      - name: Single-worm synthetic tests
        run: python -m unittest discover -s packages/single-worm-methods/tests
        env:
          PYTHONPATH: packages/single-worm-methods
