name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.2'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv run --no-project --python 3.11.15 tools/check_source.py
      - run: uv sync --locked --extra cpu --managed-python
      - run: uv pip check
      - name: Verify source export and its file checksums
        if: runner.os == 'Linux'
        run: uv run --no-sync tools/export_source.py --output "$RUNNER_TEMP/WormStudio-source"
      - name: Windows x64 desktop startup from a Unicode path
        if: runner.os == 'Windows'
        run: uv run --no-sync tests/windows_desktop_smoke.py
      - run: uv run --no-sync run_tests.py
      - name: Check browser script syntax, including native ES modules
        run: |
          for source in web/*.js; do
            node --check "$source"
          done
        shell: bash
      - run: node --test tests/*.js tests/*.cjs
        shell: bash
