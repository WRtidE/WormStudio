name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_source.py
      - run: python run_tests.py
      - run: node --test tests/annotation-coordinates.test.js tests/test_annotation_readiness.cjs
      - name: Single-worm synthetic tests
        run: python -m unittest discover -s packages/single-worm-methods/tests
        env:
          PYTHONPATH: packages/single-worm-methods
