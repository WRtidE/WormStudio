name: Mac development smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.2'
          enable-cache: true
      - run: uv sync --locked --extra cpu --managed-python
      - name: Verify native imports and local workspace without downloading models
        run: |
          uv pip check
          uv run --no-sync python -c "import platform; assert platform.machine() == 'arm64'; import cv2, torch, torchvision"
          uv run --no-sync python -c "from electron_desktop import command; import subprocess; subprocess.run([*command()[:1], '--version'], check=True)"
          uv run --no-sync tools/check_environment.py --code-only
          uv run --no-sync python -m unittest discover -s tests -p 'test_macos_portability.py'
        env:
          PYTHONPATH: src
