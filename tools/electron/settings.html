<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>WormStudio 设置</title><link rel="stylesheet" href="settings.css"><script defer src="settings.js"></script>
</head>
<body>
<nav aria-label="设置分类">
  <h1>设置</h1>
  <button id="general-tab"><svg viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>通用</button>
  <button id="updates-tab" aria-current="page"><svg viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-3L3 10m0-6v6h6m-5 4a8 8 0 0 0 14 3l3-3m0 6v-6h-6"/></svg>软件更新</button>
</nav>
<main>
  <section id="updates">
    <h2>软件更新</h2>
    <div class="group">
      <div class="row"><span>当前版本 <b id="current"></b></span><button id="check">检查更新</button></div>
      <label class="row" for="auto">启动时自动检查更新<input id="auto" type="checkbox" role="switch"></label>
    </div>
    <p id="message" role="status" hidden></p>
    <section id="release" class="group release" hidden>
      <h3>发现新版本 <span id="version"></span></h3>
      <div id="notes"></div>
      <div class="download-row"><span id="transfer" role="status"></span><button id="download" class="primary"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><span>下载新版</span></button></div>
    </section>
  </section>
  <section id="general" hidden><h2>通用</h2><div class="group"><div class="row"><span>工作目录</span><button id="workspace">在文件夹中打开</button></div>
    <div id="gpu-row" hidden>
      <div class="row"><span>NVIDIA 显卡加速</span><button id="gpu" aria-describedby="gpu-status">检测 GPU</button></div>
      <p id="gpu-status" role="status" hidden></p>
      <div id="gpu-transfer" hidden>
        <progress id="gpu-progress" aria-label="GPU 组件下载进度"></progress>
        <span id="gpu-bytes"></span>
      </div>
      <button id="gpu-install" class="primary" aria-describedby="gpu-status" hidden>安装 GPU 加速组件</button>
    </div>
  </div></section>
</main></body></html>
