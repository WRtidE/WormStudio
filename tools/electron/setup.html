<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self';">
<title>WormStudio · 首次准备</title><link rel="stylesheet" href="setup.css"></head>
<body>
<main><header><div class="brand"><img src="../../web/wormstudio-icon.png" alt=""><span>WormStudio</span></div><span id="mode" class="chip">检测中</span></header>
<h1 id="title">正在检测设备</h1><p id="detail" class="description" aria-live="polite">自动选择合适的运行环境。</p>
<div class="device"><span>设备</span><strong id="hardware">正在识别…</strong></div>
<section class="transfer"><div class="transfer-meta"><span id="bytes">正在检查组件</span><span id="percent">—</span></div><progress id="progress" max="100" aria-label="组件下载进度"></progress></section>
<ul id="items" aria-label="组件列表"></ul><p id="error" role="alert" hidden></p>
<footer><button id="cpu" class="secondary" hidden>改用 CPU</button><button id="action" disabled>检测中…</button></footer>
</main><script src="setup.js"></script></body></html>
