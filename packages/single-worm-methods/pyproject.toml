[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wormstudio-single"
version = "0.2.0"
description = "Single-worm contour and centerline extraction with conservative temporal self-contact recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-image>=0.23,<0.27",
  "opencv-python>=4.8,<6", "imageio-ffmpeg>=0.5,<0.7"
]

[project.optional-dependencies]
inference = ["torch>=2.5,<3", "torchvision>=0.20,<1", "einops==0.8.1", "hydra-core>=1.3,<1.4", "iopath>=0.1.10", "tqdm>=4.66", "Pillow>=10"]

[project.scripts]
wormstudio-single = "wormstudio_single.__main__:main"

[tool.setuptools.packages.find]
include = ["wormstudio_single*"]
namespaces = true

[tool.setuptools.package-data]
wormstudio_single = ["_vendor/tapnet/LICENSE", "_vendor/tapnet/SOURCE.json"]
