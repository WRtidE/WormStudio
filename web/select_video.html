<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worm Studio · 选择新视频</title><link rel="stylesheet" href="/annotation.css"><link rel="stylesheet" href="/processing.css"></head>
<body class="processing-page"><header class="app-header"><div class="brand"><span class="brand-icon">W</span><div><strong>Worm Studio</strong><span class="brand-sub">线虫姿态分析工作台</span></div></div><div class="local-status"><i></i>本地工作台</div></header>
<main class="processing-content select-content"><a class="back-link" href="/progress">← 返回上一份结果</a><section class="progress-card select-card"><p class="eyebrow">START A NEW ANALYSIS</p><h1>选择下一个视频</h1><p class="intro">导入视频后，重新点选线虫、标定尺寸并选择中线方法。</p>
<label class="video-drop" id="drop-zone"><span class="upload-symbol">＋</span><strong>点击选择，或拖入视频</strong><span>MP4 · AVI · MOV · MKV</span><input id="video-file" type="file" accept="video/*,.mkv,.avi" aria-label="选择视频文件"></label><p class="help">文件仅传入本机工作台并保存在 input_videos 中，不会上传到互联网。</p>
<div class="choice-divider"><span>也可以直接读取本机视频</span></div><form id="path-form"><label class="field-label" for="video-path">视频完整路径</label><div class="path-row"><input id="video-path" type="text" placeholder="例如 D:\videos\example.mp4" autocomplete="off" required><button id="open-path" class="primary" type="submit">打开视频 →</button></div><p class="help">填写路径可直接读取原文件，无需复制。之前的分析结果会保留。</p></form>
<div id="import-status" class="import-status" role="status" hidden><p id="import-message"></p><progress id="import-progress" max="100" value="0"></progress></div><p id="select-error" class="select-error" role="alert" hidden></p></section></main><script src="/select-video.js"></script></body></html>
