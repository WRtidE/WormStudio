<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worm Studio · 重新标注</title><link rel="stylesheet" href="/annotation.css"><link rel="stylesheet" href="/processing.css"></head>
<body class="processing-page"><header class="app-header"><div class="brand"><span class="brand-icon">W</span><strong>Worm Studio</strong></div><div class="file-chip" id="review-video-name">正在读取视频</div></header>
<main class="processing-content select-content"><a class="back-link" href="/progress">← 返回当前结果</a><section class="progress-card select-card"><p class="eyebrow">REVIEW & REFINE</p><h1>选择更清晰的标注帧</h1><p class="intro">寻找线虫彼此分离、身体轮廓清晰的画面，再重新确认每条虫的掩膜。</p>
<form id="review-form"><label class="field-label" for="review-frame">标注帧号（从 0 开始）</label><div class="frame-controls"><input id="review-frame" type="number" min="0" step="1" value="0" required aria-label="标注帧号"><input id="frame-range" type="range" min="0" step="1" value="0" aria-label="浏览视频帧"><span id="frame-count"></span></div><img id="frame-preview" class="frame-preview" alt="标注帧预览"><p id="preview-state" class="help" role="status">正在读取帧…</p><p class="help">旧标注和结果保留。新任务沿用当前像素比例和方法，重新选取区域与虫体掩膜。更换标注帧不能保证解决所有接触或遮挡。</p><button id="start-review" class="primary" disabled>用此帧重新标注 →</button></form><p id="review-error" class="select-error" role="alert" hidden></p></section></main><script src="/review.js"></script></body></html>
